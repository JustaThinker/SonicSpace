android.useAndroidX=true
android.newDsl=false

# Performance & JVM Heap
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC

# Parallel & Caching
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin & KSP Incremental Compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
ksp.incremental.intermodule=false

# Flow Neuroengine
FLOW_NEURO_BASE_URL=https://api.flowneuroengine.com
FLOW_NEURO_API_KEY=dummy_key

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
